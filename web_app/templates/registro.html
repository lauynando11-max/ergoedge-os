{% extends "base.html" %}

{% block content %}
<style>
    @keyframes gradientBG {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }
    
    @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
    }
    
    @keyframes pulse {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.8; }
    }
    
    .gradient-bg-page {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 25%, #f093fb 50%, #4facfe 75%, #00f2fe 100%);
        background-size: 400% 400%;
        animation: gradientBG 15s ease infinite;
        min-height: 100vh;
        padding: 3rem 0;
        position: relative;
        overflow: hidden;
    }
    
    .gradient-bg-page::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: radial-gradient(circle at 20% 50%, rgba(255, 255, 255, 0.15), transparent 50%);
        pointer-events: none;
    }
    
    .gradient-bg-page::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: radial-gradient(circle at 80% 80%, rgba(255, 255, 255, 0.1), transparent 50%);
        pointer-events: none;
    }
    
    .glass-card-dark {
        background: rgba(0, 0, 0, 0.75);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 20px;
        box-shadow: 0 25px 45px rgba(0, 0, 0, 0.3);
    }
    
    .form-control-dark {
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: white;
        transition: all 0.3s ease;
    }
    
    .form-control-dark:focus {
        background: rgba(255, 255, 255, 0.15);
        border-color: rgba(255, 255, 255, 0.4);
        box-shadow: 0 0 0 0.2rem rgba(118, 75, 162, 0.25);
        color: white;
    }
    
    .form-control-dark::placeholder {
        color: rgba(255, 255, 255, 0.4);
    }
    
    .form-label {
        color: rgba(255, 255, 255, 0.9);
    }
    
    .text-gradient {
        background: linear-gradient(135deg, #667eea, #764ba2, #f093fb);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
    }
    
    .btn-gradient {
        background: linear-gradient(135deg, #667eea, #764ba2, #f093fb);
        background-size: 200% auto;
        border: none;
        transition: all 0.3s ease;
    }
    
    .btn-gradient:hover {
        background-position: right center;
        transform: translateY(-2px);
        box-shadow: 0 10px 20px -5px rgba(118, 75, 162, 0.4);
    }
    
    .animate-float-slow {
        animation: float 6s ease-in-out infinite;
    }
    
    .icon-bg {
        width: 70px;
        height: 70px;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto;
    }
</style>

<div class="gradient-bg-page">
    <div class="position-absolute top-0 start-0 w-100 h-100 overflow-hidden" style="pointer-events: none;">
        <div class="position-absolute" style="top: 10%; left: 5%; width: 300px; height: 300px; background: rgba(255,255,255,0.1); border-radius: 50%; filter: blur(50px); animation: pulse 8s ease-in-out infinite;"></div>
        <div class="position-absolute" style="bottom: 10%; right: 5%; width: 400px; height: 400px; background: rgba(255,255,255,0.1); border-radius: 50%; filter: blur(60px); animation: pulse 6s ease-in-out infinite reverse;"></div>
        <div class="position-absolute" style="top: 50%; left: 50%; width: 250px; height: 250px; background: rgba(255,255,255,0.15); border-radius: 50%; filter: blur(40px);"></div>
    </div>
    
    <div class="container position-relative" style="z-index: 2;">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="glass-card-dark animate-float-slow">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <div class="icon-bg mb-3">
                                <i class="fas fa-user-plus fa-2x text-gradient"></i>
                            </div>
                            <h2 class="fw-bold text-gradient" data-i18n="register.title">Crear Cuenta</h2>
                            <p class="text-white-50" data-i18n="register.subtitle">Regístrate para comenzar</p>
                        </div>

                        {% if error %}
                        <div class="alert alert-danger alert-dismissible fade show bg-danger bg-opacity-25 text-white border-danger" role="alert">
                            <i class="fas fa-exclamation-circle me-2"></i>{{ error }}
                            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert"></button>
                        </div>
                        {% endif %}

                        <form method="POST" action="/registro">
                            <div class="mb-3">
                                <label class="form-label fw-semibold">
                                    <i class="fas fa-user me-2 text-gradient"></i><span data-i18n="register.name">Nombre completo</span>
                                </label>
                                <input type="text" name="nombre" class="form-control form-control-dark form-control-lg" placeholder="Tu nombre" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">
                                    <i class="fas fa-envelope me-2 text-gradient"></i><span data-i18n="register.email">Correo electrónico</span>
                                </label>
                                <input type="email" name="email" class="form-control form-control-dark form-control-lg" placeholder="tu@email.com" required>
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-semibold">
                                    <i class="fas fa-lock me-2 text-gradient"></i><span data-i18n="register.password">Contraseña</span>
                                </label>
                                <input type="password" name="password" class="form-control form-control-dark form-control-lg" placeholder="Mínimo 6 caracteres" required>
                            </div>
                            <button type="submit" class="btn btn-gradient w-100 py-2 rounded-pill fw-semibold">
                                <i class="fas fa-user-plus me-2"></i><span data-i18n="register.button">Registrarse</span>
                            </button>
                        </form>

                        <div class="text-center mt-4">
                            <p class="text-white-50"><span data-i18n="register.login_link">¿Ya tienes cuenta?</span> 
                                <a href="/login" class="fw-semibold text-decoration-none text-gradient">
                                    <span data-i18n="register.login_link_text">Iniciar Sesión</span> <i class="fas fa-arrow-right ms-1"></i>
                                </a>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
